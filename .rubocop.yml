# Keep diagnostics focused on likely bugs, not personal style preferences.
AllCops:
  TargetRubyVersion: 3.4
  DisabledByDefault: true
  NewCops: disable
  SuggestExtensions: false
  Exclude:
    - "node_modules/**/*"
    - "integration/rails_app/node_modules/**/*"
    - "integration/rails_app/db/schema.rb"
    - "integration/rails_app/log/**/*"
    - "integration/rails_app/tmp/**/*"
    - "integration/rails_app/public/**/*"
    - "vendor/**/*"

Lint:
  Enabled: true

Security:
  Enabled: true

# Empty Rails base controllers and models are intentional.
Lint/EmptyClass:
  Enabled: false

# Explicit overrides for the most common editor style diagnostics.
Style/StringLiterals:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/Documentation:
  Enabled: false
